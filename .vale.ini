StylesPath = styles
MinAlertLevel = suggestion
Vocab = PaperMoon

# To also lint against Google's style, run `vale sync` after adding:
#   Packages = Google
# then add `Google` to the BasedOnStyles list below. Off by default to keep
# this config offline-runnable.

[*.md]
BasedOnStyles = Vale, PaperMoon

TokenIgnores = (?:dApp|TestNet|MainNet|ERC-\d+|JSON-RPC)
BlockIgnores = (?s) *(```.*?```)

# Rule-source files describe the rules and intentionally contain examples of
# banned content. Exclude them from style checks; subjecting them to their
# own rules is circular.
[AGENTS.md]
BasedOnStyles =

[style-guide.md]
BasedOnStyles =

[checklist.md]
BasedOnStyles =
