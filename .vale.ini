StylesPath = styles
MinAlertLevel = suggestion

Packages = Google

[*.md]
BasedOnStyles = Vale, Google, PaperMoon

# Allow PaperMoon-specific terminology that Google's style would flag.
TokenIgnores = (?:dApp|TestNet|MainNet|ERC-\d+|JSON-RPC)

# Markdown-specific rules.
BlockIgnores = (?s) *(```.*?```)
