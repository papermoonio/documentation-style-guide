StylesPath = styles
MinAlertLevel = suggestion
Vocab = PaperMoon

# To also lint against Google's style, run `vale sync` after adding:
#   Packages = Google
# then add `Google` to the BasedOnStyles list below. Off by default to keep
# this config offline-runnable.

[*.md]
BasedOnStyles = Vale, PaperMoon

# Vale.Spelling (Hunspell) is disabled: this styleguide enforces house style,
# not spelling. On technical docs the spell-checker flags an endless tail of
# valid tool/package names (npm, toolchain, Turbopack, ...) with no
# typo-catching benefit worth the vocab-curation toil. The curated PaperMoon
# house-style rules and Vale.Repetition/Vale.Terms stay enabled. Adopting
# repos inherit this as the default house behavior.
Vale.Spelling = NO

TokenIgnores = (?:dApp|TestNet|MainNet|ERC-\d+|JSON-RPC)
BlockIgnores = (?s) *(```.*?```)

# Rule-source files describe the rules and intentionally contain examples of
# banned content. Exclude them from style checks; subjecting them to their
# own rules is circular.
[AGENTS.md]
BasedOnStyles =

[style-guide.md]
BasedOnStyles =

[checklist.md]
BasedOnStyles =
